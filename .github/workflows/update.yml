name: Update data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["pipeline/**", "data/**"]
  schedule:
    - cron: "17 6 * * 1"   # weekly, Monday 06:17 UTC

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - name: Run pipeline
        id: run
        run: |
          set +e
          python pipeline/run.py > run.log 2>&1
          status=$?
          tail -n 80 run.log
          mkdir -p docs/data
          tail -n 80 run.log > docs/data/last_run.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Commit updated data (or just the log if the run failed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ steps.run.outputs.status }}" = "0" ]; then
            git add docs/data
          else
            git add docs/data/last_run.log
          fi
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "Update data [skip ci]"
            git push
          fi
          test "${{ steps.run.outputs.status }}" = "0"
