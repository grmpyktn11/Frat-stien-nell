<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connection Web</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<style>
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.find{flex:1 1 260px;min-width:0}
.results{list-style:none;margin:4px 0 0;padding:0;border:1px solid var(--ink);background:var(--surface)}
.results button{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;gap:8px;width:100%;min-height:44px;padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--line)}
.results li:last-child button{border-bottom:0}
.results button:hover,.results button:focus-visible{background:var(--hl)}
.results .t{font-family:var(--mono);font-size:11px;color:var(--muted)}
.key{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted);margin-bottom:8px}
.key span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:10px;height:10px}
#chart{position:relative;border:1px solid var(--ink);background:var(--surface);height:min(72vh,760px);min-height:460px;touch-action:none;overflow:hidden}
#chart svg{display:block;width:100%;height:100%;cursor:grab}
#chart svg:active{cursor:grabbing}
.zoom{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:4px}
.zoom .btn{width:44px;padding:0;font-size:18px}
text{font-family:var(--sans);paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round;pointer-events:none}
#panel{margin-top:12px;border-top:2px solid var(--ink);padding-top:10px;min-height:60px}
#panel h2{font-family:var(--serif);font-weight:600;font-size:22px;margin:0 0 4px}
#panel h3{font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:12px 0 4px}
#panel ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
#panel li button{min-height:36px;padding:0 10px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
#panel li button:hover{border-color:var(--ink)}
@media (max-width:719px){.find{flex-basis:100%}.bar select{flex:1 1 100%}.bar .btn{flex:1;padding:0 6px}.wrap{padding:16px 0 32px}.top,.stats,.bar,.key,#panel{margin-left:16px;margin-right:16px}.top{padding-left:0;padding-right:0}#chart{border-left:0;border-right:0}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1><a href="index.html">Frat-stien-nell</a></h1>
    <nav class="tabs" aria-label="Pages"><a href="index.html">Ledger</a><a href="web.html" aria-current="page">Web</a><a href="sources.html">Sources</a></nav>
  </header>
  <div class="stats" id="stats"></div>
  <div class="bar">
    <div class="find"><label class="field"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><span class="sr">Find a person, college or fraternity</span><input id="q" type="search" placeholder="Find a person, college or fraternity" autocomplete="off" enterkeyhint="search" aria-controls="results"></label>
    <ul id="results" class="results" hidden></ul></div>
    <label class="sr" for="grp">People</label><select id="grp"><option value="">All people</option><option value="epstein">Epstein files</option><option value="scandal">Other scandals</option></select>
    <button class="btn" id="tColleges" aria-pressed="true">Colleges</button>
    <button class="btn" id="tFrats" aria-pressed="true">Fraternities</button>
    <button class="btn" id="tIvy" aria-pressed="false">Ivy only</button>
  </div>
  <div class="key">
    <span><svg width="12" height="12" aria-hidden="true"><rect width="12" height="12" fill="var(--college)"/></svg>College (size = people)</span>
    <span><svg width="12" height="12" aria-hidden="true"><rect x="2" y="2" width="8" height="8" transform="rotate(45 6 6)" fill="var(--frat)"/></svg>Fraternity / sorority</span>
    <span><svg width="12" height="12" aria-hidden="true"><circle cx="6" cy="6" r="4" fill="var(--ink)"/></svg>Epstein files</span>
    <span><svg width="12" height="12" aria-hidden="true"><circle cx="6" cy="6" r="3.5" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.8"/></svg>Other scandal</span>
  </div>
  <div id="chart">
    <svg id="svg" role="img" aria-label="Network of people linked to the colleges and fraternities they share"></svg>
    <div class="zoom"><button class="btn" id="zin" aria-label="Zoom in">+</button><button class="btn" id="zout" aria-label="Zoom out">−</button><button class="btn" id="zfit" aria-label="Fit to screen"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button></div>
  </div>
  <section id="panel" aria-live="polite"><p class="muted" style="margin:0">Select a node to see its connections.</p></section>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const GREEK={Alpha:"Α",Beta:"Β",Gamma:"Γ",Delta:"Δ",Epsilon:"Ε",Zeta:"Ζ",Eta:"Η",Theta:"Θ",Iota:"Ι",Kappa:"Κ",Lambda:"Λ",Mu:"Μ",Nu:"Ν",Xi:"Ξ",Omicron:"Ο",Pi:"Π",Rho:"Ρ",Sigma:"Σ",Tau:"Τ",Upsilon:"Υ",Phi:"Φ",Chi:"Χ",Psi:"Ψ",Omega:"Ω"};
const greek=o=>{const w=o.split(/\s+/);return w.every(x=>GREEK[x])?w.map(x=>GREEK[x]).join(""):o};
const state={colleges:true,frats:true,ivy:false,grp:"",sel:null};
let G,sim,zoom,svg,gRoot,gLinks,gNodes,nodeSel,linkSel,labelSel,k=1;

fetch("data/graph.json").then(r=>r.json()).then(g=>{
  G=g;const c=g.counts;
  $("stats").innerHTML=`<span><b>${c.people_linked}</b>people linked</span><span><b>${c.colleges}</b>colleges</span><span><b>${c.frats}</b>fraternities</span><span><b>${c.people_unlinked}</b>with no shared link</span>`;
  init();draw();
}).catch(e=>{$("panel").innerHTML=`<p class="muted">Could not load data: ${esc(e.message)}</p>`});

function visible(){
  const keepNode=n=>n.type==="college"?state.colleges&&(!state.ivy||n.ivy):n.type==="frat"?state.frats:true;
  const hubs=new Set(G.nodes.filter(n=>n.type!=="person"&&keepNode(n)).map(n=>n.id));
  const allLinks=G.links.filter(l=>hubs.has(l.target.id||l.target));
  const okPerson=new Set(G.nodes.filter(n=>n.type==="person"&&(!state.grp||(state.grp==="epstein"?n.epstein:n.cases.length))).map(n=>n.id));
  const links=allLinks.filter(l=>okPerson.has(l.source.id||l.source));
  const people=new Set(links.map(l=>l.source.id||l.source));
  const used=new Set(links.map(l=>l.target.id||l.target));
  const nodes=G.nodes.filter(n=>n.type==="person"?people.has(n.id):hubs.has(n.id)&&(n.ivy||used.has(n.id)));
  return {nodes,links};
}
function size(n){return n.type==="person"?4:n.type==="frat"?7:5+Math.sqrt(n.count)*3.2}
function init(){
  svg=d3.select("#svg");gRoot=svg.append("g");gLinks=gRoot.append("g");gNodes=gRoot.append("g");
  zoom=d3.zoom().scaleExtent([.2,6]).on("zoom",e=>{gRoot.attr("transform",e.transform);k=e.transform.k;labels()});
  svg.call(zoom).on("dblclick.zoom",null);
  svg.on("click",e=>{if(e.target===svg.node())select(null)});
  sim=d3.forceSimulation().force("link",d3.forceLink().id(d=>d.id).distance(l=>l.kind==="frat"?38:60).strength(.6))
    .force("charge",d3.forceManyBody().strength(d=>d.type==="person"?-45:-260))
    .force("collide",d3.forceCollide(d=>size(d)+3))
    .force("x",d3.forceX().strength(.04)).force("y",d3.forceY().strength(.05));
  $("zin").onclick=()=>svg.transition().call(zoom.scaleBy,1.4);
  $("zout").onclick=()=>svg.transition().call(zoom.scaleBy,1/1.4);
  $("zfit").onclick=fit;
  [["tColleges","colleges"],["tFrats","frats"],["tIvy","ivy"]].forEach(([id,key])=>$(id).onclick=()=>{state[key]=!state[key];$(id).setAttribute("aria-pressed",state[key]);draw()});
  $("grp").onchange=()=>{state.grp=$("grp").value;draw()};
  const res=$("results");
  const pick=id=>{res.hidden=true;$("q").value=G.nodes.find(n=>n.id===id).label;$("q").blur();select(id);focus(id);$("chart").scrollIntoView({block:"start",behavior:"smooth"})};
  $("q").addEventListener("input",()=>{
    const v=$("q").value.trim().toLowerCase();
    if(!v){res.hidden=true;res.innerHTML="";return}
    const hits=G.nodes.filter(n=>n.label.toLowerCase().includes(v)).sort((a,b)=>a.label.toLowerCase().indexOf(v)-b.label.toLowerCase().indexOf(v)).slice(0,6);
    res.innerHTML=hits.map(n=>`<li><button data-id="${esc(n.id)}"><span>${esc(n.label)}</span><span class="t">${n.type==="person"?"person":n.type==="frat"?"fraternity":"college"}</span></button></li>`).join("")||'<li class="muted" style="padding:10px 12px">No matches</li>';
    res.hidden=false;
  });
  $("q").addEventListener("keydown",e=>{if(e.key==="Enter"){const b=res.querySelector("button");if(b)pick(b.dataset.id);else $("q").blur()}if(e.key==="Escape"){res.hidden=true;$("q").blur()}});
  res.addEventListener("click",e=>{const b=e.target.closest("button[data-id]");if(b)pick(b.dataset.id)});
  new ResizeObserver(()=>{sizeSvg()}).observe($("chart"));
}
function sizeSvg(){const r=$("chart").getBoundingClientRect();svg.attr("viewBox",[-r.width/2,-r.height/2,r.width,r.height])}
function draw(){
  sizeSvg();
  const {nodes,links}=visible();
  const cCol=css("--college"),cFrat=css("--frat"),cInk=css("--ink"),cLine=css("--line");
  linkSel=gLinks.selectAll("line").data(links,d=>(d.source.id||d.source)+"|"+(d.target.id||d.target))
    .join("line").attr("stroke",d=>d.kind==="frat"?cFrat:cLine).attr("stroke-width",d=>d.kind==="frat"?1.6:1).attr("stroke-opacity",.9);
  nodeSel=gNodes.selectAll("g.n").data(nodes,d=>d.id).join(enter=>{
    const g=enter.append("g").attr("class","n").style("cursor","pointer");
    g.each(function(d){
      const s=d3.select(this),r=size(d);
      if(d.type==="college")s.append("rect").attr("x",-r).attr("y",-r).attr("width",r*2).attr("height",r*2).attr("fill",cCol);
      else if(d.type==="frat")s.append("rect").attr("x",-r*.75).attr("y",-r*.75).attr("width",r*1.5).attr("height",r*1.5).attr("transform","rotate(45)").attr("fill",cFrat);
      else if(d.epstein)s.append("circle").attr("r",r).attr("fill",cInk);
      else s.append("circle").attr("r",r-.5).attr("fill",css("--surface")).attr("stroke",cInk).attr("stroke-width",1.8);
      s.append("text").attr("dy",d.type==="person"?-8:-(r+5)).attr("text-anchor","middle")
        .attr("font-size",d.type==="person"?10:d.type==="frat"?12:11).attr("font-weight",d.type==="person"?400:600)
        .attr("fill",d.type==="college"?cCol:d.type==="frat"?cFrat:cInk)
        .text(d.type==="frat"?greek(d.label):d.label);
    });
    g.on("click",(e,d)=>{e.stopPropagation();select(d.id)});
    g.call(d3.drag().on("start",(e,d)=>{if(!e.active)sim.alphaTarget(.2).restart();d.fx=d.x;d.fy=d.y})
      .on("drag",(e,d)=>{d.fx=e.x;d.fy=e.y}).on("end",(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null}));
    return g;
  });
  labelSel=nodeSel.select("text");
  sim.nodes(nodes);sim.force("link").links(links);
  sim.on("tick",()=>{
    linkSel.attr("x1",d=>d.source.x).attr("y1",d=>d.source.y).attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);
    nodeSel.attr("transform",d=>`translate(${d.x},${d.y})`);
  });
  sim.alpha(1).restart();
  setTimeout(fit,1400);
  if(state.sel&&!nodes.find(n=>n.id===state.sel))select(null);else highlight();
}
function neighbors(id){
  const s=new Set([id]);
  G.links.forEach(l=>{const a=l.source.id||l.source,b=l.target.id||l.target;if(a===id)s.add(b);if(b===id)s.add(a)});
  return s;
}
function labels(){
  if(!labelSel)return;
  const nb=state.sel?neighbors(state.sel):null;
  labelSel.attr("display",d=>{
    if(nb)return nb.has(d.id)?null:"none";
    if(d.type==="person")return k>1.8?null:"none";
    if(d.type==="college")return d.ivy||d.count>=3||k>1.2?null:"none";
    return null;
  });
}
function highlight(){
  const nb=state.sel?neighbors(state.sel):null;
  nodeSel.attr("opacity",d=>!nb||nb.has(d.id)?1:.12);
  linkSel.attr("opacity",d=>!nb||(d.source.id===state.sel||d.target.id===state.sel)?1:.05);
  labels();
}
function select(id){
  state.sel=id;highlight();
  if(!id){$("panel").innerHTML='<p class="muted" style="margin:0">Select a node to see its connections.</p>';return}
  const n=G.nodes.find(x=>x.id===id);
  const members=hub=>G.links.filter(l=>(l.target.id||l.target)===hub).map(l=>l.source.id||l.source);
  const btn=nid=>{const m=G.nodes.find(x=>x.id===nid);return `<li><button data-id="${esc(nid)}">${esc(m.type==="frat"?m.label:m.label)}</button></li>`};
  let h="";
  if(n.type==="person"){
    const hubs=G.links.filter(l=>(l.source.id||l.source)===id).map(l=>l.target.id||l.target);
    h=`<h2>${esc(n.label)}</h2><p class="muted" style="margin:0">${esc(n.description)}</p><p style="margin:4px 0 0;font-size:13px">${[n.epstein?"Epstein files":"",...n.cases].filter(Boolean).map(esc).join(" · ")}</p>`+hubs.map(hid=>{
      const hub=G.nodes.find(x=>x.id===hid),others=members(hid).filter(x=>x!==id);
      return `<h3>${esc(hub.label)}${others.length?` — shared with ${others.length}`:""}</h3>${others.length?`<ul>${others.map(btn).join("")}</ul>`:'<p class="muted" style="margin:0">No one else in this dataset.</p>'}`;
    }).join("");
  }else{
    const m=members(id);
    h=`<h2>${esc(n.label)}${n.type==="frat"&&greek(n.label)!==n.label?` <span class="muted" style="font-size:18px">${esc(greek(n.label))}</span>`:""}</h2><p class="muted" style="margin:0">${n.type==="frat"?"Fraternity / sorority":"College"} · ${m.length} ${m.length===1?"person":"people"}</p><h3>Members</h3><ul>${m.map(btn).join("")}</ul>`;
  }
  $("panel").innerHTML=h;
  $("panel").querySelectorAll("button[data-id]").forEach(b=>b.onclick=()=>{select(b.dataset.id);focus(b.dataset.id)});
}
function focus(id){
  const n=sim.nodes().find(x=>x.id===id);if(!n)return;
  svg.transition().duration(500).call(zoom.transform,d3.zoomIdentity.scale(Math.max(k,1.6)).translate(-n.x,-n.y));
}
function fit(){
  const ns=sim.nodes();if(!ns.length)return;
  const r=$("chart").getBoundingClientRect();
  const x0=d3.min(ns,d=>d.x)-30,x1=d3.max(ns,d=>d.x)+30,y0=d3.min(ns,d=>d.y)-30,y1=d3.max(ns,d=>d.y)+30;
  const s=Math.min(3,.95*Math.min(r.width/(x1-x0),r.height/(y1-y0)));
  svg.transition().duration(500).call(zoom.transform,d3.zoomIdentity.scale(s).translate(-(x0+x1)/2,-(y0+y1)/2));
}
</script>
</body>
</html>
