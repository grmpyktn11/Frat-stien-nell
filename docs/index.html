<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f1e7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15130f" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Big Red Flags</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<style>
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;-webkit-tap-highlight-color:transparent}
#stage{position:absolute;inset:0;touch-action:none;background:var(--bg)}
#svg{display:block;width:100%;height:100%}
text{font-family:var(--sans);paint-order:stroke;stroke:var(--bg);stroke-width:3.5px;stroke-linejoin:round;pointer-events:none}

/* floating chrome */
.bar{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 12px) 0 calc(env(safe-area-inset-left) + 12px);display:flex;gap:8px;align-items:flex-start;pointer-events:none;z-index:5}
.bar>*{pointer-events:auto}
.brand{display:none}
.find{position:relative;flex:1;min-width:0}
.find .field{box-shadow:0 2px 10px rgba(0,0,0,.08)}
.results{position:absolute;left:0;right:0;top:calc(100% + 4px);list-style:none;margin:0;padding:0;border:1px solid var(--ink);background:var(--surface);max-height:42dvh;overflow:auto;box-shadow:0 6px 20px rgba(0,0,0,.12)}
.results button{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;min-height:48px;padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--line)}
.results li:last-child button{border-bottom:0}
.results button:hover,.results button:focus-visible{background:var(--hl)}
.results .t{font-family:var(--mono);font-size:11px;color:var(--muted);flex-shrink:0}
.results .none{padding:12px;color:var(--muted)}
.ib{position:relative;width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--ink);background:var(--surface);color:var(--ink);cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.08);flex-shrink:0}
.ib:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.badge{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--frat);color:#fff;font:600 11px/18px var(--sans);text-align:center}
.badge[hidden]{display:none}
.zoom{position:absolute;right:calc(env(safe-area-inset-right) + 12px);bottom:calc(env(safe-area-inset-bottom) + var(--sheet-h,0px) + 12px);display:flex;flex-direction:column;gap:6px;z-index:4;transition:bottom .25s}
.menu{position:absolute;top:calc(100% + 6px);right:0;min-width:180px;background:var(--surface);border:1px solid var(--ink);box-shadow:0 6px 20px rgba(0,0,0,.12);display:flex;flex-direction:column}
.menu a,.menu button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;min-height:48px;padding:0 14px;cursor:pointer;border-bottom:1px solid var(--line);font-size:15px}
.menu>:last-child{border-bottom:0}
.menu a:hover,.menu button:hover{background:var(--hl)}
.menu[hidden]{display:none}
.wrapm{position:relative}

/* key chip */
.key{position:absolute;left:calc(env(safe-area-inset-left) + 12px);bottom:calc(env(safe-area-inset-bottom) + var(--sheet-h,0px) + 12px);display:flex;flex-wrap:wrap;gap:4px 12px;max-width:calc(100% - 90px);padding:6px 10px;background:color-mix(in srgb,var(--surface) 88%,transparent);border:1px solid var(--line);font-size:11px;color:var(--muted);z-index:4;transition:bottom .25s}
.key span{display:inline-flex;align-items:center;gap:5px}

/* sheets */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:2px solid var(--ink);box-shadow:0 -8px 30px rgba(0,0,0,.15);display:flex;flex-direction:column;max-height:78dvh;transform:translateY(100%);transition:transform .25s ease;padding-bottom:env(safe-area-inset-bottom)}
.sheet.open{transform:none}
.sheet:not(.open){visibility:hidden;transition:transform .25s ease,visibility 0s .25s}
.grab{all:unset;display:flex;justify-content:center;align-items:center;height:28px;cursor:grab;flex-shrink:0;touch-action:none}
.grab::before{content:"";width:40px;height:5px;border-radius:3px;background:var(--dot)}
.sh-head{display:flex;align-items:flex-start;gap:10px;padding:0 16px 10px;flex-shrink:0}
.sh-head h2{margin:0;font-family:var(--serif);font-weight:600;font-size:24px;line-height:1.15;flex:1;min-width:0}
.sh-body{overflow:auto;padding:0 16px 16px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.sheet.peek .sh-body{display:none}
.sh-title{flex:1;min-width:0}
body.sheetfull .key,body.sheetfull .zoom{opacity:0;pointer-events:none}
.key,.zoom{transition:bottom .25s,opacity .2s}
.sub{color:var(--muted);font-size:14px;margin:2px 0 0}
.sh-body h3{font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.chips{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.chips button{min-height:40px;padding:0 12px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:14px}
.chips button:hover{border-color:var(--ink)}
.chips button.ivy{font-weight:600}
.chips button.frat{color:var(--frat);border-color:color-mix(in srgb,var(--frat) 40%,var(--line))}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.fact{background:var(--bg);border:1px solid var(--line);padding:10px}
.fact .l{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.fact .v{font-size:15px;font-weight:600;margin-top:2px}
.case{font-size:14px;margin:4px 0}
.links{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:14px;font-size:14px}

/* filter sheet */
.seg{display:flex;border:1px solid var(--ink)}
.seg button{flex:1;min-height:44px;border:0;border-right:1px solid var(--ink);background:var(--surface);cursor:pointer;font-size:14px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;border-bottom:1px solid var(--line)}
.row label{flex:1;font-size:15px}
.switch{appearance:none;width:46px;height:28px;border-radius:14px;background:var(--dot);position:relative;cursor:pointer;flex-shrink:0;margin:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);transition:left .15s}
.switch:checked{background:var(--ink)}
.switch:checked::after{left:21px}
.switch:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.schools button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stats2{display:flex;flex-wrap:wrap;gap:4px 16px;font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:14px}
.stats2 b{font-family:var(--serif);font-size:18px;color:var(--ink);font-weight:600;margin-right:3px}
.sh-foot{display:flex;gap:8px;padding:10px 16px 12px;border-top:1px solid var(--line);flex-shrink:0}
.sh-foot .btn{flex:1}

.immersive .bar,.immersive .key{opacity:0;pointer-events:none}
.immersive .bar .exit{opacity:1}
.bar,.key{transition:opacity .2s}
.exitfs{position:absolute;top:calc(env(safe-area-inset-top) + 10px);right:calc(env(safe-area-inset-right) + 12px);z-index:7}
.exitfs[hidden]{display:none}
.load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-family:var(--mono);font-size:13px}

@media (min-width:760px){
  .bar{padding-left:20px;padding-right:20px;padding-top:16px}
  .brand{display:flex;align-items:center;height:44px;padding:0 14px;background:var(--surface);border:1px solid var(--ink);font-family:var(--serif);font-weight:600;font-size:22px;box-shadow:0 2px 10px rgba(0,0,0,.08);text-decoration:none;flex-shrink:0}
  .find{max-width:420px}
  .sheet{left:auto;right:20px;bottom:20px;top:80px;width:400px;max-height:none;border:2px solid var(--ink);transform:translateX(calc(100% + 40px))}
  .sheet.open{transform:none}
  .sheet.peek .sh-body{display:block}
  .grab{display:none}
  .sh-head{padding-top:16px}
  .zoom{bottom:20px;right:calc(var(--sheet-w,0px) + 20px);transition:right .25s}
  .key{bottom:20px;left:20px}
}
@media (prefers-reduced-motion:reduce){.sheet,.zoom,.key{transition:none}}
</style>
</head>
<body>
<div id="stage">
  <svg id="svg" role="img" aria-label="Network of people linked by the colleges and fraternities they share"></svg>
  <div class="load" id="load">Loading…</div>
</div>

<div class="bar" id="bar">
  <a class="brand" href="index.html">Big Red <span style="color:var(--red)">Flags</span></a>
  <div class="find">
    <label class="field"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><span class="sr">Search people, colleges, fraternities</span><input id="q" type="search" placeholder="Search" autocomplete="off" enterkeyhint="search" aria-controls="results" aria-autocomplete="list"></label>
    <ul id="results" class="results" hidden></ul>
  </div>
  <button class="ib" id="fbtn" aria-label="Filters" aria-controls="fsheet" aria-expanded="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg><span class="badge" id="fcount" hidden></span></button>
  <div class="wrapm">
    <button class="ib" id="mbtn" aria-label="Menu" aria-haspopup="true" aria-expanded="false" aria-controls="menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="5" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="12" cy="19" r="1.2"/></svg></button>
    <div class="menu" id="menu" hidden>
      <button id="fsbtn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>Full screen</button>
      <a href="list.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>List</a>
      <a href="sources.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5v14z"/></svg>Sources</a>
    </div>
  </div>
</div>
<button class="ib exitfs" id="exitfs" aria-label="Exit full screen" hidden><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg></button>

<div class="key" id="key">
  <span><svg width="11" height="11" aria-hidden="true"><rect width="11" height="11" fill="var(--college)"/></svg>Ivy</span>
  <span><svg width="11" height="11" aria-hidden="true"><rect x="1" y="1" width="9" height="9" fill="none" stroke="var(--college)" stroke-width="2"/></svg>College</span>
  <span><svg width="11" height="11" aria-hidden="true"><rect x="2" y="2" width="7" height="7" transform="rotate(45 5.5 5.5)" fill="var(--frat)"/></svg>Fraternity</span>
  <span><svg width="11" height="11" aria-hidden="true"><path d="M5.5 1L10 10H1z" fill="var(--club)"/></svg>Society / club</span>
  <span><svg width="11" height="11" aria-hidden="true"><path d="M5.5 1L10 10H1z" fill="var(--pub)"/></svg>Paper / political</span>
  <span><svg width="11" height="11" aria-hidden="true"><circle cx="5.5" cy="5.5" r="4" fill="var(--ink)"/></svg>Epstein files</span>
  <span><svg width="11" height="11" aria-hidden="true"><circle cx="5.5" cy="5.5" r="3.5" fill="none" stroke="var(--ink)" stroke-width="1.6"/></svg>Other scandal</span>
</div>

<div class="zoom" id="zoomc">
  <button class="ib" id="zin" aria-label="Zoom in"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="ib" id="zout" aria-label="Zoom out"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>
  <button class="ib" id="zfit" aria-label="Fit to screen"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</div>

<section class="sheet" id="dsheet" aria-label="Details" aria-live="polite">
  <button class="grab" id="dgrab" aria-label="Expand details"></button>
  <div class="sh-head"><div class="sh-title"><h2 id="dtitle"></h2><p class="sub" id="dsub"></p></div><button class="ib" id="dclose" aria-label="Close details" style="box-shadow:none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="sh-body" id="dbody"></div>
</section>

<section class="sheet" id="fsheet" aria-label="Filters">
  <button class="grab" id="fgrab" aria-label="Close filters"></button>
  <div class="sh-head"><h2>Filters</h2><button class="ib" id="fclose" aria-label="Close filters" style="box-shadow:none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="sh-body">
    <h3>People</h3>
    <div class="seg" id="grp"><button data-v="" aria-pressed="true">All</button><button data-v="epstein" aria-pressed="false">Epstein files</button><button data-v="scandal" aria-pressed="false">Other scandals</button></div>
    <h3>Show</h3>
    <div class="row"><label for="tCol">Colleges</label><input class="switch" type="checkbox" id="tCol" checked></div>
    <div class="row"><label for="tFrat">Fraternities &amp; sororities</label><input class="switch" type="checkbox" id="tFrat" checked></div>
    <div class="row"><label for="tClub">Secret societies &amp; clubs</label><input class="switch" type="checkbox" id="tClub" checked></div>
    <div class="row"><label for="tPub">Student papers &amp; political groups</label><input class="switch" type="checkbox" id="tPub" checked></div>
    <div class="row"><label for="tHonor">Honor societies</label><input class="switch" type="checkbox" id="tHonor"></div>
    <div class="row"><label for="tIvy">Ivy League only</label><input class="switch" type="checkbox" id="tIvy"></div>
    <div class="row"><label for="tShared">Only shared links (2+ people)</label><input class="switch" type="checkbox" id="tShared"></div>
    <h3>Focus on a school</h3>
    <ul class="chips schools" id="schools"></ul>
    <div class="stats2" id="stats"></div>
  </div>
  <div class="sh-foot"><button class="btn" id="freset">Reset</button><button class="btn" id="fdone" style="background:var(--ink);color:var(--bg)">Done</button></div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl=u=>/^https:\/\//.test(u||"")?u:"#";
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const GREEK={Alpha:"Α",Beta:"Β",Gamma:"Γ",Delta:"Δ",Epsilon:"Ε",Zeta:"Ζ",Eta:"Η",Theta:"Θ",Iota:"Ι",Kappa:"Κ",Lambda:"Λ",Mu:"Μ",Nu:"Ν",Xi:"Ξ",Omicron:"Ο",Pi:"Π",Rho:"Ρ",Sigma:"Σ",Tau:"Τ",Upsilon:"Υ",Phi:"Φ",Chi:"Χ",Psi:"Ψ",Omega:"Ω"};
const greek=o=>{const w=o.split(/\s+/);return w.every(x=>GREEK[x])?w.map(x=>GREEK[x]).join(""):o};
const SHORT={"Brown University":"Brown","Columbia University":"Columbia","Cornell University":"Cornell","Dartmouth College":"Dartmouth","Harvard University":"Harvard","University of Pennsylvania":"Penn","Princeton University":"Princeton","Yale University":"Yale","Massachusetts Institute of Technology":"MIT","Stanford University":"Stanford","New York University":"NYU","London School of Economics":"LSE"};
const IVYS=["Brown University","Columbia University","Cornell University","Dartmouth College","Harvard University","University of Pennsylvania","Princeton University","Yale University"];
const DEF={grp:"",colleges:true,frats:true,clubs:true,pubs:true,honor:false,ivy:false,shared:false,school:""};
const KIND={society:"Secret / senior society",club:"Club",publication:"Student publication",political:"Student political group",honor:"Honor society"};
const kindColor=k=>k==="honor"?"--honor":(k==="publication"||k==="political")?"--pub":"--club";
const state={...DEF,sel:null};
const mqWide=matchMedia("(min-width:760px)");
let G,P={},byId={},adj={},sim,zoom,svg,gRoot,gLinks,gNodes,nodeSel,linkSel,k=1,firstFit=true;

Promise.all([fetch("data/graph.json").then(r=>r.json()),fetch("data/people.json").then(r=>r.json())]).then(([g,p])=>{
  G=g;p.people.forEach(x=>P[x.name]=x);
  G.nodes.forEach(n=>byId[n.id]=n);
  G.links.forEach(l=>{(adj[l.source]=adj[l.source]||[]).push(l.target);(adj[l.target]=adj[l.target]||[]).push(l.source)});
  $("load").remove();
  $("schools").innerHTML=IVYS.filter(s=>byId["i:"+s]).map(s=>`<li><button data-id="i:${esc(s)}" aria-pressed="false">${esc(SHORT[s])} <span class="muted">${byId["i:"+s].count}</span></button></li>`).join("");
  init();readHash();draw();
}).catch(e=>{$("load").textContent="Could not load data: "+e.message});

/* ---------- filtering ---------- */
function hubOk(n){
  if(n.type==="college")return state.colleges&&(!state.ivy||n.ivy)&&(!state.shared||n.count>=2);
  if(n.type==="frat")return state.frats&&(!state.shared||n.count>=2);
  if(n.type==="club"){const on=n.kind==="honor"?state.honor:(n.kind==="publication"||n.kind==="political")?state.pubs:state.clubs;return on&&(!state.shared||n.count>=2)}
  return false;
}
function personOk(n){return !state.grp||(state.grp==="epstein"?n.epstein:n.cases.length)}
function visible(){
  let links=G.links.filter(l=>{const s=byId[l.source.id||l.source],t=byId[l.target.id||l.target];return personOk(s)&&(hubOk(t)||state.school===t.id)});
  if(state.school){
    const members=new Set(links.filter(l=>(l.target.id||l.target)===state.school).map(l=>l.source.id||l.source));
    links=links.filter(l=>members.has(l.source.id||l.source));
  }
  const ids=new Set();links.forEach(l=>{ids.add(l.source.id||l.source);ids.add(l.target.id||l.target)});
  return {nodes:G.nodes.filter(n=>ids.has(n.id)),links};
}
function activeFilters(){return Object.keys(DEF).filter(k=>state[k]!==DEF[k]).length}

/* ---------- drawing ---------- */
function size(n){return n.type==="person"?4.5:n.type==="frat"||n.type==="club"?6.5+Math.sqrt(n.count):5+Math.sqrt(n.count)*3.4}
function init(){
  svg=d3.select("#svg");gRoot=svg.append("g");gLinks=gRoot.append("g");gNodes=gRoot.append("g");
  zoom=d3.zoom().scaleExtent([.15,8]).on("zoom",e=>{gRoot.attr("transform",e.transform);k=e.transform.k;labels()});
  svg.call(zoom).on("dblclick.zoom",null);
  svg.on("click",e=>{if(e.target===svg.node()){select(null);closeFilters();hideResults()}});
  sim=d3.forceSimulation()
    .force("link",d3.forceLink().id(d=>d.id).distance(l=>l.kind==="college"?54:36).strength(.7))
    .force("charge",d3.forceManyBody().strength(d=>d.type==="person"?-40:-240).distanceMax(420))
    .force("collide",d3.forceCollide(d=>size(d)+3))
    .force("x",d3.forceX().strength(.05)).force("y",d3.forceY().strength(.06));
  new ResizeObserver(sizeSvg).observe($("stage"));
  bindUI();
}
function sizeSvg(){
  const r=$("stage").getBoundingClientRect();svg.attr("viewBox",[-r.width/2,-r.height/2,r.width,r.height]);
  /* shape the layout to the screen: tall phones get a tall graph */
  const a=Math.max(.4,Math.min(2.5,r.height/r.width));
  sim.force("x").strength(.06*Math.sqrt(a));sim.force("y").strength(.06/Math.sqrt(a));
}
function draw(){
  sizeSvg();
  const {nodes,links}=visible();
  const cCol=css("--college"),cFrat=css("--frat"),cInk=css("--ink"),cLine=css("--line"),cSurf=css("--surface");
  linkSel=gLinks.selectAll("line").data(links,d=>(d.source.id||d.source)+"|"+(d.target.id||d.target))
    .join("line").attr("stroke",d=>d.kind==="frat"?cFrat:d.kind==="club"?css(kindColor(byId[d.target.id||d.target].kind)):cLine).attr("stroke-width",d=>d.kind==="college"?1.1:1.6);
  nodeSel=gNodes.selectAll("g.n").data(nodes,d=>d.id).join(enter=>{
    const g=enter.append("g").attr("class","n").style("cursor","pointer");
    g.each(function(d){
      const s=d3.select(this),r=size(d);
      if(d.type==="college"){
        if(d.ivy)s.append("rect").attr("x",-r).attr("y",-r).attr("width",r*2).attr("height",r*2).attr("fill",cCol);
        else s.append("rect").attr("x",-r+1).attr("y",-r+1).attr("width",r*2-2).attr("height",r*2-2).attr("fill",cSurf).attr("stroke",cCol).attr("stroke-width",2);
      }else if(d.type==="club")s.append("path").attr("d",d3.symbol(d3.symbolTriangle,r*r*2.2)()).attr("fill",css(kindColor(d.kind)));
      else if(d.type==="frat")s.append("rect").attr("x",-r*.75).attr("y",-r*.75).attr("width",r*1.5).attr("height",r*1.5).attr("transform","rotate(45)").attr("fill",cFrat);
      else if(d.epstein)s.append("circle").attr("r",r).attr("fill",cInk);
      else s.append("circle").attr("r",r-.6).attr("fill",cSurf).attr("stroke",cInk).attr("stroke-width",1.7);
      s.append("circle").attr("r",Math.max(r+8,16)).attr("fill","transparent");/* touch target */
      s.append("text").attr("text-anchor","middle").attr("font-weight",d.type==="person"?400:600)
        .attr("fill",d.type==="college"?cCol:d.type==="frat"?cFrat:d.type==="club"?css(kindColor(d.kind)):cInk)
        .text(d.type==="frat"?greek(d.label):d.type==="college"?(SHORT[d.label]||d.label):d.label);
    });
    g.on("click",(e,d)=>{e.stopPropagation();hideResults();closeFilters();select(d.id)});
    g.call(d3.drag().on("start",(e,d)=>{if(!e.active)sim.alphaTarget(.2).restart();d.fx=d.x;d.fy=d.y})
      .on("drag",(e,d)=>{d.fx=e.x;d.fy=e.y}).on("end",(e,d)=>{if(!e.active)sim.alphaTarget(0);d.fx=null;d.fy=null}));
    return g;
  });
  sim.nodes(nodes);sim.force("link").links(links);
  sim.on("tick",()=>{
    linkSel.attr("x1",d=>d.source.x).attr("y1",d=>d.source.y).attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);
    nodeSel.attr("transform",d=>`translate(${d.x},${d.y})`);
  });
  sim.alpha(1).restart();
  const settle=()=>{if(state.sel&&nodes.includes(byId[state.sel]))focus(state.sel);else fit()};
  clearTimeout(draw.t);draw.t=setTimeout(settle,700);
  sim.on("end.fit",()=>{sim.on("end.fit",null);if(state.sel&&sim.nodes().includes(byId[state.sel]))focus(state.sel);else fit()});
  if(state.sel&&!nodes.find(n=>n.id===state.sel))select(null);else{highlight();labels()}
  const n=activeFilters();$("fcount").hidden=!n;$("fcount").textContent=n;
  const people=nodes.filter(n=>n.type==="person").length,cols=nodes.filter(n=>n.type==="college").length,fr=nodes.filter(n=>n.type==="frat").length;
  const cl=nodes.filter(n=>n.type==="club").length;
  $("stats").innerHTML=`<span><b>${people}</b>people</span><span><b>${cols}</b>colleges</span><span><b>${fr}</b>fraternities</span><span><b>${cl}</b>societies &amp; clubs</span>`;
  $("svg").setAttribute("aria-label",`Network: ${people} people, ${cols} colleges, ${fr} fraternities`);
}
function neighbors(id){return new Set([id,...(adj[id]||[])])}
function labels(){
  if(!nodeSel)return;
  const nb=state.sel?neighbors(state.sel):null,small=!mqWide.matches;
  nodeSel.select("text").each(function(d){
    const r=size(d),fs=(d.type==="person"?10.5:d.type==="frat"?12.5:11.5)/Math.pow(k,.75);
    let show;
    if(nb)show=nb.has(d.id);
    else if(d.type==="person")show=k>(small?2.2:1.7);
    else if(d.type==="college")show=d.ivy||d.count>=(small?4:3)||k>1.3;
    else show=d.count>=2||k>1.1||d.type==="club";
    d3.select(this).attr("display",show?null:"none").attr("font-size",fs).attr("dy",-(r+4));
  });
}
function highlight(){
  if(!nodeSel)return;
  const nb=state.sel?neighbors(state.sel):null;
  nodeSel.attr("opacity",d=>!nb||nb.has(d.id)?1:.1);
  linkSel.attr("opacity",d=>!nb||(d.source.id===state.sel||d.target.id===state.sel)?1:.04);
}

/* ---------- selection & detail sheet ---------- */
function members(hub){return (adj[hub]||[]).filter(id=>byId[id].type==="person")}
function chip(id,cls=""){const n=byId[id];return `<li><button class="${cls}" data-id="${esc(id)}">${esc(n.type==="college"?(SHORT[n.label]||n.label):n.label)}</button></li>`}
function select(id,fromHash){
  state.sel=id;highlight();labels();
  if(!fromHash)history.replaceState(null,"",id?"#"+encodeURIComponent(id):location.pathname+location.search);
  if(!id){closeSheet($("dsheet"));return}
  const n=byId[id];let h="",sub="";
  if(n.type==="person"){
    const p=P[n.name]||{};
    const hubs=(adj[id]||[]);
    const cases=[p.epstein?`<div class="case"><b>Epstein files</b>${p.documents&&p.documents.length?` <span class="muted">· ${esc(p.documents.join(", "))}</span>`:""}</div>`:"",...(p.cases||[]).map(c=>`<div class="case"><b>${esc(c.case)}</b> <span class="muted">· ${esc(c.outcome)}</span></div>`)].join("");
    sub=esc(n.description);
    const ivy=Object.entries(p.schools||{}).filter(([s,x])=>x.status==="yes").map(([s])=>s);
    h=`${cases}
      <div class="facts"><div class="fact"><div class="l">Ivy League</div><div class="v">${esc(ivy.join(", ")||"—")}</div></div><div class="fact"><div class="l">Fraternity</div><div class="v">${p.frat?.status==="unknown"?"Unknown":esc((p.frat?.orgs||[]).join(", ")||"—")}</div></div></div>
      ${(p.orgs||[]).filter(o=>o.status==="yes").length?`<h3>Societies &amp; clubs</h3>${p.orgs.filter(o=>o.status==="yes").map(o=>`<div class="case"><b>${esc(o.name)}</b> <span class="muted">· ${esc(KIND[o.kind]||o.kind)}${o.evidence&&o.evidence[0]?.url?` · <a href="${safeUrl(o.evidence[0].url)}" target="_blank" rel="noopener">source</a>`:""}</span></div>`).join("")}`:""}
      ${(p.colleges||[]).length?`<h3>Colleges</h3><p style="margin:0;font-size:14px">${esc(p.colleges.join(" · "))}</p>`:""}
      ${hubs.map(hid=>{const hub=byId[hid],others=members(hid).filter(x=>x!==id);
        return `<h3>${esc(hub.type==="frat"?hub.label:(SHORT[hub.label]||hub.label))} · ${others.length?`shared with ${others.length}`:"no one else"}</h3>${others.length?`<ul class="chips">${others.map(o=>chip(o)).join("")}</ul>`:""}`}).join("")}
      ${p.note?`<p class="sub" style="margin-top:12px">${esc(p.note)}</p>`:""}
      <div class="links">${n.url?`<a href="${safeUrl(n.url)}" target="_blank" rel="noopener">${p.manual?"Profile":"Wikipedia"}</a>`:""}<a href="list.html#${encodeURIComponent(n.name)}">Full record</a></div>`;
  }else{
    const m=members(id);
    sub=`${n.type==="frat"?"Fraternity / sorority":n.type==="club"?esc(KIND[n.kind]||"Club")+(n.school?" · "+esc(n.school):""):n.ivy?"Ivy League":"College"} · ${m.length} ${m.length===1?"person":"people"}${n.type==="frat"&&greek(n.label)!==n.label?" · "+esc(greek(n.label)):""}`;
    const ep=m.filter(x=>byId[x].epstein),sc=m.filter(x=>!byId[x].epstein);
    h=(ep.length?`<h3>Epstein files · ${ep.length}</h3><ul class="chips">${ep.map(x=>chip(x)).join("")}</ul>`:"")+(sc.length?`<h3>Other scandals · ${sc.length}</h3><ul class="chips">${sc.map(x=>chip(x)).join("")}</ul>`:"")+
      (n.type==="college"?`<div class="links"><button class="btn" id="focusSchool">${state.school===id?"Show everything":"Show only this network"}</button></div>`:"");
  }
  $("dtitle").textContent=n.label;$("dsub").innerHTML=sub;
  $("dbody").innerHTML=h;
  $("dbody").querySelectorAll("button[data-id]").forEach(b=>b.onclick=()=>{select(b.dataset.id);focus(b.dataset.id)});
  const fs=$("focusSchool");if(fs)fs.onclick=()=>{state.school=state.school===id?"":id;syncFilterUI();draw()};
  closeFilters();openSheet($("dsheet"),mqWide.matches?"full":"peek");
}
function focus(id){
  const n=sim.nodes().find(x=>x.id===id);if(!n)return;
  const r=$("stage").getBoundingClientRect(),sheetH=mqWide.matches?0:Math.min(r.height*.35,260),sheetW=mqWide.matches&&$("dsheet").classList.contains("open")?420:0;
  const s=Math.max(k,1.8);
  svg.transition().duration(450).call(zoom.transform,d3.zoomIdentity.translate(-sheetW/2,-sheetH/2).scale(s).translate(-n.x,-n.y));
}
function fit(){
  const ns=sim.nodes();if(!ns.length)return;
  const r=$("stage").getBoundingClientRect(),top=70,bottom=mqWide.matches?20:70;
  const x0=d3.min(ns,d=>d.x)-24,x1=d3.max(ns,d=>d.x)+24,y0=d3.min(ns,d=>d.y)-24,y1=d3.max(ns,d=>d.y)+24;
  const s=Math.min(2.5,Math.min(r.width/(x1-x0),(r.height-top-bottom)/(y1-y0)));
  svg.transition().duration(firstFit?0:450).call(zoom.transform,d3.zoomIdentity.translate(0,(top-bottom)/2).scale(s).translate(-(x0+x1)/2,-(y0+y1)/2));
  firstFit=false;
}

/* ---------- sheets ---------- */
function setSheetVars(){
  const d=$("dsheet"),f=$("fsheet");
  const open=[d,f].find(s=>s.classList.contains("open"));
  const h=open&&!mqWide.matches?open.getBoundingClientRect().height:0;
  document.documentElement.style.setProperty("--sheet-h",h+"px");
  document.documentElement.style.setProperty("--sheet-w",open&&mqWide.matches?"420px":"0px");
}
function openSheet(s,mode){s.classList.add("open");s.classList.toggle("peek",mode==="peek");document.body.classList.toggle("sheetfull",mode!=="peek"&&!mqWide.matches);s.querySelector(".grab").setAttribute("aria-label",mode==="peek"?"Expand":"Collapse");requestAnimationFrame(setSheetVars)}
function closeSheet(s){s.classList.remove("open","peek");if(![$("dsheet"),$("fsheet")].some(x=>x.classList.contains("open")&&!x.classList.contains("peek")))document.body.classList.remove("sheetfull");requestAnimationFrame(setSheetVars)}
function openFilters(){closeSheet($("dsheet"));openSheet($("fsheet"),"full");$("fbtn").setAttribute("aria-expanded","true")}
function closeFilters(){if(!$("fsheet").classList.contains("open"))return;closeSheet($("fsheet"));$("fbtn").setAttribute("aria-expanded","false");if(state.sel)openSheet($("dsheet"),"peek")}
function dragSheet(sheet,grab,onTap,onDown,onUp){
  let y0=null,moved=false;
  grab.addEventListener("pointerdown",e=>{y0=e.clientY;moved=false;grab.setPointerCapture(e.pointerId)});
  grab.addEventListener("pointermove",e=>{if(y0!==null&&Math.abs(e.clientY-y0)>6){moved=true;sheet.style.transition="none";sheet.style.transform=`translateY(${Math.max(0,e.clientY-y0)}px)`}});
  grab.addEventListener("pointerup",e=>{const dy=e.clientY-y0;y0=null;sheet.style.transition="";sheet.style.transform="";if(moved){if(dy>60)onDown();else if(dy<-40)onUp()}});
  /* taps use the click event so the expanding sheet can't receive a ghost click */
  grab.addEventListener("click",e=>{e.stopPropagation();if(!moved)onTap()});
}

/* ---------- search ---------- */
function hideResults(){$("results").hidden=true}
function resetScroll(){if(scrollX||scrollY)scrollTo(0,0)}
function pick(id){hideResults();const inp=$("q");inp.value="";inp.blur();
  if(!visible().nodes.find(n=>n.id===id)){Object.assign(state,DEF);syncFilterUI();draw()}
  select(id);setTimeout(()=>focus(id),state.sel?60:950)}

/* ---------- UI bindings ---------- */
function syncFilterUI(){
  $("grp").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===state.grp));
  $("tCol").checked=state.colleges;$("tFrat").checked=state.frats;$("tClub").checked=state.clubs;$("tPub").checked=state.pubs;$("tHonor").checked=state.honor;$("tIvy").checked=state.ivy;$("tShared").checked=state.shared;
  $("schools").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.id===state.school));
}
function bindUI(){
  $("zin").onclick=()=>svg.transition().call(zoom.scaleBy,1.5);
  $("zout").onclick=()=>svg.transition().call(zoom.scaleBy,1/1.5);
  $("zfit").onclick=fit;
  $("fbtn").onclick=()=>$("fsheet").classList.contains("open")?closeFilters():openFilters();
  $("fclose").onclick=$("fdone").onclick=closeFilters;
  $("freset").onclick=()=>{Object.assign(state,DEF);syncFilterUI();draw()};
  $("grp").onclick=e=>{const b=e.target.closest("button");if(!b)return;state.grp=b.dataset.v;syncFilterUI();draw()};
  [["tCol","colleges"],["tFrat","frats"],["tClub","clubs"],["tPub","pubs"],["tHonor","honor"],["tIvy","ivy"],["tShared","shared"]].forEach(([id,key])=>$(id).onchange=()=>{state[key]=$(id).checked;draw()});
  $("schools").onclick=e=>{const b=e.target.closest("button");if(!b)return;state.school=state.school===b.dataset.id?"":b.dataset.id;syncFilterUI();draw();if(state.school)select(state.school)};
  $("dclose").onclick=()=>select(null);
  dragSheet($("dsheet"),$("dgrab"),()=>{const d=$("dsheet");openSheet(d,d.classList.contains("peek")?"full":"peek")},()=>{const d=$("dsheet");d.classList.contains("peek")?select(null):openSheet(d,"peek")},()=>openSheet($("dsheet"),"full"));
  dragSheet($("fsheet"),$("fgrab"),closeFilters,closeFilters,()=>{});
  const res=$("results");
  $("q").addEventListener("input",()=>{
    const v=$("q").value.trim().toLowerCase();
    if(!v){hideResults();res.innerHTML="";return}
    const hits=G.nodes.filter(n=>n.label.toLowerCase().includes(v)||(SHORT[n.label]||"").toLowerCase().includes(v)||(n.type==="frat"&&greek(n.label).toLowerCase().includes(v)))
      .sort((a,b)=>a.label.toLowerCase().indexOf(v)-b.label.toLowerCase().indexOf(v)||(b.count||0)-(a.count||0)).slice(0,8);
    res.innerHTML=hits.map(n=>`<li><button data-id="${esc(n.id)}"><span>${esc(n.label)}</span><span class="t">${n.type==="person"?(n.epstein?"Epstein files":"scandal"):n.type==="frat"?"fraternity":n.type==="club"?(n.kind==="publication"?"paper":n.kind==="political"?"political":n.kind==="honor"?"honor":"society/club"):n.ivy?"Ivy":"college"}</span></button></li>`).join("")||'<li class="none">No matches</li>';
    res.hidden=false;
  });
  $("q").addEventListener("focus",()=>{closeFilters();if($("q").value.trim())res.hidden=false});
  $("q").addEventListener("blur",()=>setTimeout(resetScroll,50));
  addEventListener("scroll",resetScroll,{passive:true});
  if(window.visualViewport)visualViewport.addEventListener("resize",()=>setTimeout(resetScroll,50));
  $("q").addEventListener("keydown",e=>{
    if(e.key==="Enter"){const b=res.querySelector("button");b?pick(b.dataset.id):$("q").blur()}
    else if(e.key==="Escape"){hideResults();$("q").blur()}
    else if(e.key==="ArrowDown"){const b=res.querySelector("button");if(b){e.preventDefault();b.focus()}}
  });
  res.addEventListener("keydown",e=>{const b=e.target.closest("button");if(!b)return;const li=b.parentElement;
    if(e.key==="ArrowDown"){e.preventDefault();li.nextElementSibling?.querySelector("button")?.focus()}
    if(e.key==="ArrowUp"){e.preventDefault();(li.previousElementSibling?.querySelector("button")||$("q")).focus()}
    if(e.key==="Escape"){hideResults();$("q").focus()}});
  res.addEventListener("click",e=>{const b=e.target.closest("button[data-id]");if(b)pick(b.dataset.id)});
  const menu=$("menu");
  $("mbtn").onclick=e=>{e.stopPropagation();menu.hidden=!menu.hidden;$("mbtn").setAttribute("aria-expanded",!menu.hidden)};
  document.addEventListener("click",e=>{if(!menu.hidden&&!e.target.closest(".wrapm")){menu.hidden=true;$("mbtn").setAttribute("aria-expanded","false")}});
  $("fsbtn").onclick=()=>{menu.hidden=true;enterFS()};
  $("exitfs").onclick=exitFS;
  document.addEventListener("fullscreenchange",()=>{if(!document.fullscreenElement)document.body.classList.remove("immersive"),$("exitfs").hidden=true});
  addEventListener("hashchange",readHash);
  mqWide.addEventListener("change",()=>{setSheetVars();labels()});
  document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!e.target.closest("input")){if($("fsheet").classList.contains("open"))closeFilters();else select(null)}});
}
function enterFS(){
  document.body.classList.add("immersive");$("exitfs").hidden=false;
  const el=document.documentElement;
  if(el.requestFullscreen)el.requestFullscreen().catch(()=>{});else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen();
}
function exitFS(){
  document.body.classList.remove("immersive");$("exitfs").hidden=true;
  if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});else if(document.webkitFullscreenElement)document.webkitExitFullscreen();
}
function readHash(){
  const id=decodeURIComponent(location.hash.slice(1));
  if(id&&byId[id]&&id!==state.sel){select(id,true);if(sim)setTimeout(()=>focus(id),1000)}
}
</script>
